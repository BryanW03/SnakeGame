<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SnakeGame.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // Stop the page from scrolling when the arrow keys / space are used inside the game.
        window.addEventListener('keydown', function (e) {
            var keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '];
            if (keys.indexOf(e.key) !== -1 && e.target && e.target.closest && e.target.closest('.game')) {
                e.preventDefault();
            }
        });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
